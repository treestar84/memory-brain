<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="title desc">
  <title id="title">memory-brain — 서버 없는 AI 장기기억 엔진</title>
  <desc id="desc">memory-brain 과 클라우드 메모리 도구의 5가지 차이 비교: 서버, API 비용, 저장 형식, 답변 근거, 부패 관리</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14181c"/>
      <stop offset="100%" stop-color="#0b0d0f"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="640" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="638" rx="23" fill="none" stroke="#2a2f35" stroke-width="1.5"/>

  <!-- Header -->
  <text x="60" y="76" class="sans" font-size="34" font-weight="700" fill="#ffffff">memory-brain</text>
  <text x="60" y="108" class="sans" font-size="19" fill="#c3c2b7">서버 없는 AI 장기기억 — Claude Code · Codex 를 위한 CFGM-OS</text>

  <!-- top-right badges -->
  <g class="sans" font-size="14" font-weight="600">
    <rect x="900" y="52" width="90" height="30" rx="15" fill="#161b1f" stroke="#2a2f35"/>
    <text x="945" y="72" text-anchor="middle" fill="#0ca30c">MIT</text>
    <rect x="1000" y="52" width="140" height="30" rx="15" fill="#161b1f" stroke="#2a2f35"/>
    <text x="1070" y="72" text-anchor="middle" fill="#8fd18f">LLM 호출 0회</text>
  </g>

  <line x1="60" y1="132" x2="1140" y2="132" stroke="#2a2f35" stroke-width="1"/>

  <!-- Column headers -->
  <text x="620" y="172" text-anchor="middle" class="sans" font-size="17" font-weight="700" fill="#8fd18f">memory-brain</text>
  <text x="960" y="172" text-anchor="middle" class="sans" font-size="17" font-weight="700" fill="#8a8a86">일반적인 클라우드 메모리 도구</text>

  <!-- divider between label col and two value cols -->
  <line x1="440" y1="150" x2="440" y2="586" stroke="#22262b" stroke-width="1"/>
  <line x1="800" y1="150" x2="800" y2="586" stroke="#22262b" stroke-width="1"/>

  <!-- Rows -->
  <g class="sans" font-size="18">
    <!-- row template: label at x=60, my value centered at 620, other value centered at 960 -->

    <!-- Row 1 -->
    <text x="60" y="224" fill="#ffffff" font-weight="600">서버</text>
    <circle cx="530" cy="219" r="11" fill="#0ca30c"/>
    <text x="530" y="224" text-anchor="middle" fill="#0b0d0f" font-size="14" font-weight="700">✓</text>
    <text x="560" y="224" fill="#e7e7e2">없음 — 로컬 파일 + git</text>
    <circle cx="870" cy="219" r="11" fill="none" stroke="#6b6b66" stroke-width="2"/>
    <text x="870" y="224" text-anchor="middle" fill="#a8a8a2" font-size="13" font-weight="700">!</text>
    <text x="900" y="224" fill="#a8a8a2" font-size="16">별도 서버·호스팅 필요</text>

    <!-- Row 2 -->
    <text x="60" y="278" fill="#ffffff" font-weight="600">API 비용</text>
    <circle cx="530" cy="273" r="11" fill="#0ca30c"/>
    <text x="530" y="278" text-anchor="middle" fill="#0b0d0f" font-size="14" font-weight="700">✓</text>
    <text x="560" y="278" fill="#e7e7e2">0원 — host 구독 재사용</text>
    <circle cx="870" cy="273" r="11" fill="none" stroke="#6b6b66" stroke-width="2"/>
    <text x="870" y="278" text-anchor="middle" fill="#a8a8a2" font-size="13" font-weight="700">!</text>
    <text x="900" y="278" fill="#a8a8a2" font-size="16">별도 API 키 + 사용량 과금</text>

    <!-- Row 3 -->
    <text x="60" y="332" fill="#ffffff" font-weight="600">저장 형식</text>
    <circle cx="530" cy="327" r="11" fill="#0ca30c"/>
    <text x="530" y="332" text-anchor="middle" fill="#0b0d0f" font-size="14" font-weight="700">✓</text>
    <text x="560" y="332" fill="#e7e7e2">markdown — 직접 열람·수정·롤백</text>
    <circle cx="870" cy="327" r="11" fill="none" stroke="#6b6b66" stroke-width="2"/>
    <text x="870" y="332" text-anchor="middle" fill="#a8a8a2" font-size="13" font-weight="700">!</text>
    <text x="900" y="332" fill="#a8a8a2" font-size="16">벡터 DB — 블랙박스</text>

    <!-- Row 4 -->
    <text x="60" y="386" fill="#ffffff" font-weight="600">답변 근거</text>
    <circle cx="530" cy="381" r="11" fill="#0ca30c"/>
    <text x="530" y="386" text-anchor="middle" fill="#0b0d0f" font-size="14" font-weight="700">✓</text>
    <text x="560" y="386" fill="#e7e7e2">claim id 인용 — 출처 역추적</text>
    <circle cx="870" cy="381" r="11" fill="none" stroke="#6b6b66" stroke-width="2"/>
    <text x="870" y="386" text-anchor="middle" fill="#a8a8a2" font-size="13" font-weight="700">!</text>
    <text x="900" y="386" fill="#a8a8a2" font-size="16">근거 없이 요약만 반환</text>

    <!-- Row 5 -->
    <text x="60" y="440" fill="#ffffff" font-weight="600">부패 관리</text>
    <circle cx="530" cy="435" r="11" fill="#0ca30c"/>
    <text x="530" y="440" text-anchor="middle" fill="#0b0d0f" font-size="14" font-weight="700">✓</text>
    <text x="560" y="440" fill="#e7e7e2">실측 공개 — 성공·실패 모두</text>
    <circle cx="870" cy="435" r="11" fill="none" stroke="#6b6b66" stroke-width="2"/>
    <text x="870" y="440" text-anchor="middle" fill="#a8a8a2" font-size="13" font-weight="700">!</text>
    <text x="900" y="440" fill="#a8a8a2" font-size="16">비공개 마케팅 수치</text>
  </g>

  <line x1="60" y1="480" x2="1140" y2="480" stroke="#2a2f35" stroke-width="1"/>

  <!-- Footer callout -->
  <text x="600" y="530" text-anchor="middle" class="sans" font-size="22" font-weight="700" fill="#ffffff">
    서버 0 · API 키 0 · 추가 비용 0 — 당신의 메모리는 당신의 markdown 파일입니다
  </text>
  <text x="600" y="566" text-anchor="middle" class="mono" font-size="15" fill="#8a8a86">
    github.com/treestar84/memory-brain · MIT License
  </text>
</svg>
