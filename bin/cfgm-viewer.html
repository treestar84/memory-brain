<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>memory-brain · Dashboard</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", sans-serif;
         margin: 0; background: #0b0b0e; color: #e4e4e7; }
  code, .mono { font-family: ui-monospace, SF Mono, Menlo, monospace; }
  header { padding: 14px 22px; border-bottom: 1px solid #27272a;
           display: flex; justify-content: space-between; align-items: baseline; }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  header .refresh { color: #52525b; font-size: 11px; }
  main { display: grid; grid-template-columns: 300px 1fr 300px; height: calc(100vh - 53px); }
  #problems { border-right: 1px solid #27272a; overflow-y: auto; padding: 10px; }
  #graph { padding: 20px 24px; overflow-y: auto; }
  #stats { border-left: 1px solid #27272a; overflow-y: auto; padding: 14px; }
  #stats h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em;
              color: #71717a; margin: 0 0 10px; font-weight: 600; }
  #stats .stat-row { display: flex; justify-content: space-between; font-size: 12px;
                      margin-bottom: 4px; color: #d4d4d8; }
  #stats .stat-row .num { color: #e4e4e7; font-weight: 600; }
  #stats .stat-group { margin-bottom: 18px; }
  #stats .stat-group-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
                              color: #71717a; margin-bottom: 6px; font-weight: 600; }
  #stats .bar-row { margin-bottom: 6px; }
  #stats .bar-label { font-size: 11px; color: #a1a1aa; display: flex; justify-content: space-between; margin-bottom: 2px; }
  #stats .bar-track { height: 5px; background: #27272a; border-radius: 3px; overflow: hidden; }
  #stats .bar-fill { height: 100%; background: #60a5fa; }
  #stats .day-row { font-size: 11px; color: #a1a1aa; margin-bottom: 2px; display: flex; justify-content: space-between; }
  .problem { padding: 10px 12px; border-radius: 6px; margin-bottom: 4px; cursor: pointer;
             border-left: 3px solid transparent; transition: background 0.1s; }
  .problem:hover { background: #17171b; }
  .problem.selected { background: #27272a; border-left-color: #71717a; }
  .problem.active { border-left-color: #22c55e; }
  .problem.active.selected { border-left-color: #22c55e; background: #14532d22; }
  .problem .title { font-weight: 600; margin-bottom: 3px; font-size: 13px; }
  .problem .meta { font-size: 11px; color: #71717a; }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .dot.active { background: #22c55e; }
  .dot.resolved { background: #3b82f6; }
  .dot.archived { background: #52525b; }

  .summary { margin-bottom: 18px; color: #a1a1aa; font-size: 12px; }
  .summary code { color: #e4e4e7; background: #27272a; padding: 1px 6px; border-radius: 3px; }
  .summary .title { color: #e4e4e7; font-size: 14px; font-weight: 600; }

  .group { margin-bottom: 18px; }
  .group-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
                 color: #71717a; margin-bottom: 8px; font-weight: 600; }

  .block { border: 1px solid #27272a; border-radius: 6px; padding: 11px 14px;
           margin-bottom: 8px; background: #121217; }
  .block.superseded { opacity: 0.38; }
  .block-header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .block-label { flex: 1; font-weight: 500; min-width: 180px; }
  .block-type { display: inline-block; padding: 2px 8px; border-radius: 4px;
                font-size: 10px; font-weight: 700; letter-spacing: 0.02em; }
  .t-Problem { background: #7c3aed33; color: #a78bfa; }
  .t-State, .t-Trigger, .t-Context, .t-Constraint, .t-Rule { background: #52525b33; color: #a1a1aa; }
  .t-Cause { background: #dc262633; color: #f87171; }
  .t-Hypothesis { background: #d9770633; color: #fb923c; }
  .t-Action { background: #2563eb33; color: #60a5fa; }
  .t-Evidence { background: #05966933; color: #34d399; }
  .t-Outcome { background: #0891b233; color: #22d3ee; }
  .t-Gap { background: #be123c33; color: #fb7185; }
  .t-Question { background: #9333ea33; color: #c084fc; }

  .tag { display: inline-block; font-size: 10px; color: #71717a;
         background: #27272a; padding: 1px 6px; border-radius: 3px; }
  .lifecycle-pending { color: #fbbf24; background: #78350f33; }
  .lifecycle-asked { color: #60a5fa; background: #1e3a8a33; }
  .lifecycle-answered { color: #34d399; background: #06402133; }
  .lifecycle-stale { color: #71717a; background: #27272a; }

  .relations { margin-top: 8px; font-size: 12px; color: #a1a1aa;
               padding-top: 8px; border-top: 1px dashed #27272a; }
  .relation { display: block; margin-bottom: 2px; }
  .relation-kind { color: #fbbf24; font-weight: 600; margin-right: 4px; }

  .block-meta { margin-top: 6px; font-size: 10px; color: #52525b; }
  .empty { color: #52525b; padding: 60px 20px; text-align: center; font-size: 13px; }
  .error { color: #f87171; padding: 20px; background: #7f1d1d22; border-radius: 6px; white-space: pre-wrap; }

  #memory { border-bottom: 1px solid #27272a; padding: 16px 22px 18px; }
  #memory .search-row { display: flex; gap: 8px; margin-bottom: 12px; }
  #memory input[type="text"] { flex: 1; background: #17171b; border: 1px solid #27272a; border-radius: 6px;
    color: #e4e4e7; padding: 8px 10px; font-size: 13px; font-family: inherit; }
  #memory input[type="text"]:focus { outline: none; border-color: #52525b; }
  #memory-cols { display: grid; grid-template-columns: 1fr 220px 220px; gap: 16px; align-items: start; }
  #memory-cols h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #71717a;
    margin: 0 0 8px; font-weight: 600; }
  .wiki-row, .hit-row { padding: 6px 8px; border-radius: 4px; font-size: 12px; margin-bottom: 2px; }
  .wiki-row:hover, .hit-row:hover { background: #17171b; }
  .wiki-row .id, .hit-row .id { color: #e4e4e7; }
  .wiki-row .badge, .hit-row .badge { font-size: 10px; color: #71717a; margin-left: 6px; }
  .hit-row .snippet { color: #71717a; font-size: 11px; margin-top: 2px; }
  .status-line { font-size: 12px; color: #a1a1aa; margin-bottom: 4px; }
  .status-line .num { color: #e4e4e7; font-weight: 600; }
  .status-line.warn { color: #fbbf24; }
</style>
</head>
<body>
<header>
  <h1>🧠 memory-brain · Dashboard</h1>
  <span class="refresh mono" id="refresh">-</span>
</header>
<section id="memory">
  <div class="search-row">
    <input type="text" id="search-input" placeholder='검색어 입력 후 Enter (예: "rate limiter")' />
  </div>
  <div id="memory-cols">
    <div>
      <h3 id="results-label">위키 페이지</h3>
      <div id="memory-results"></div>
    </div>
    <div>
      <h3>인덱스 상태</h3>
      <div id="index-status"></div>
    </div>
    <div>
      <h3>Capture 큐</h3>
      <div id="capture-status"></div>
    </div>
  </div>
</section>
<main>
  <aside id="problems"></aside>
  <section id="graph"></section>
  <aside id="stats"></aside>
</main>
<script>
const BLOCK_ORDER = ["Problem","State","Trigger","Context","Constraint",
                     "Cause","Hypothesis","Action","Evidence","Outcome",
                     "Rule","Gap","Question"];

let selectedId = null;
let activeId = null;

function el(tag, attrs, ...children) {
  const n = document.createElement(tag);
  if (attrs) {
    for (const k of Object.keys(attrs)) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'dataset') for (const dk of Object.keys(v)) n.dataset[dk] = v[dk];
      else if (k === 'onClick') n.addEventListener('click', v);
      else n.setAttribute(k, v);
    }
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    n.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return n;
}

function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

function setMessage(node, text, cls) {
  clear(node);
  node.appendChild(el('div', { class: cls || 'empty' }, text));
}

async function loadProblems() {
  const root = document.getElementById('problems');
  try {
    const res = await fetch('/api/problems');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    activeId = data.active;
    renderProblems(root, data.problems || []);
    document.getElementById('refresh').textContent = new Date().toLocaleTimeString('ko-KR');
    if (selectedId) await loadGraph(selectedId);
  } catch (e) {
    setMessage(root, String(e && e.message || e), 'error');
  }
}

function renderProblems(root, problems) {
  clear(root);
  if (!problems.length) {
    setMessage(root, '저장된 문제가 없습니다. 대화로 문제가 생성되면 여기 표시됩니다.');
    return;
  }
  const sorted = [...problems].sort((a, b) => (b.lastConfirmedAt || '').localeCompare(a.lastConfirmedAt || ''));
  for (const p of sorted) {
    const classes = ['problem'];
    if (p.id === activeId) classes.push('active');
    if (p.id === selectedId) classes.push('selected');
    const card = el('div',
      {
        class: classes.join(' '),
        dataset: { id: p.id },
        onClick: () => { selectedId = p.id; loadProblems(); },
      },
      el('div', { class: 'title' },
        el('span', { class: 'dot ' + (p.status || 'active') }),
        p.title || '(제목 없음)',
      ),
      el('div', { class: 'meta mono' }, (p.slug || '') + ' · ' + (p.status || '') + ' · ' + (p.lastConfirmedAt || '').slice(0, 16).replace('T', ' ')),
    );
    root.appendChild(card);
  }
}

async function loadGraph(id) {
  const root = document.getElementById('graph');
  try {
    const res = await fetch('/api/problems/' + encodeURIComponent(id) + '/graph');
    if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + (await res.text()));
    const data = await res.json();
    renderGraph(root, data);
  } catch (e) {
    setMessage(root, String(e && e.message || e), 'error');
  }
}

function renderGraph(root, data) {
  clear(root);
  const graph = data.graph;
  const blocks = (graph && graph.blocks) || [];

  root.appendChild(buildSummary(data, blocks.length));

  if (!blocks.length) {
    root.appendChild(el('div', { class: 'empty' }, '이 문제에 저장된 블록이 없습니다.'));
    return;
  }

  const byType = {};
  for (const b of blocks) (byType[b.type] ||= []).push(b);

  for (const t of BLOCK_ORDER) {
    const items = byType[t];
    if (!items) continue;
    items.sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''));
    const group = el('div', { class: 'group' },
      el('div', { class: 'group-label' }, t + ' · ' + items.length),
    );
    for (const b of items) group.appendChild(buildBlock(b, blocks));
    root.appendChild(group);
  }
}

function buildSummary(data, blockCount) {
  const graph = data.graph || {};
  const title = data.problemTitle || graph.problemId;
  return el('div', { class: 'summary' },
    el('span', { class: 'title' }, title),
    ' ',
    el('span', { class: 'tag' }, data.problemStatus || 'unknown'),
    el('br'),
    '블록 ', el('code', null, String(blockCount)),
    ' · 델타 ', el('code', null, String(data.deltaCount ?? 0)),
    ' · id ', el('code', null, graph.problemId || '-'),
  );
}

function buildBlock(b, all) {
  const byId = Object.create(null);
  for (const x of all) byId[x.blockId] = x;

  const header = el('div', { class: 'block-header' },
    el('span', { class: 'block-type t-' + b.type }, b.type),
    el('span', { class: 'block-label' }, b.label || '(no label)'),
  );

  if (b.lifecycle) header.appendChild(el('span', { class: 'tag lifecycle-' + b.lifecycle }, b.lifecycle));
  if (b.voiCached !== undefined) header.appendChild(el('span', { class: 'tag' }, 'VOI ' + Number(b.voiCached).toFixed(2)));
  if (b.severity !== undefined) header.appendChild(el('span', { class: 'tag' }, 'sev ' + b.severity));
  if (b.detectorId) header.appendChild(el('span', { class: 'tag' }, String(b.detectorId)));
  if (b.polarity) header.appendChild(el('span', { class: 'tag' }, b.polarity));
  header.appendChild(el('span', { class: 'tag' }, 'c=' + b.confidence));

  const blockClass = 'block' + (b.status === 'superseded' ? ' superseded' : '');
  const node = el('div', { class: blockClass }, header);

  const rels = (b.relations || []);
  if (rels.length) {
    const relWrap = el('div', { class: 'relations' });
    for (const r of rels) {
      const tgt = byId[r.targetBlockId];
      const label = tgt ? String(tgt.label || '').slice(0, 60) : r.targetBlockId;
      relWrap.appendChild(
        el('span', { class: 'relation' },
          el('span', { class: 'relation-kind' }, r.kind),
          '→ ',
          label,
          ' ',
          el('span', { class: 'tag' }, 'c=' + r.confidence),
        )
      );
    }
    node.appendChild(relWrap);
  }

  const metaText = b.blockId + ' · ' + String(b.createdAt || '').slice(0, 19).replace('T', ' ')
    + (b.supersededBy ? ' · → ' + b.supersededBy : '');
  node.appendChild(el('div', { class: 'block-meta mono' }, metaText));
  return node;
}

async function loadStats() {
  const root = document.getElementById('stats');
  try {
    const res = await fetch('/api/stats?days=7');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    renderStats(root, data);
  } catch (e) {
    setMessage(root, String(e && e.message || e), 'error');
  }
}

function renderStats(root, data) {
  clear(root);
  root.appendChild(el('h2', null, '사용 통계 · 최근 ' + data.days + '일'));

  const totals = el('div', { class: 'stat-group' },
    el('div', { class: 'stat-row' }, '검색(search)', el('span', { class: 'num' }, String(data.totalSearches))),
    el('div', { class: 'stat-row' }, '질의(ask)', el('span', { class: 'num' }, String(data.totalAsks))),
    el('div', { class: 'stat-row' }, '고유 질의', el('span', { class: 'num' }, String(data.uniqueQueries))),
  );
  root.appendChild(totals);

  const tokens = data.tokens;
  if (tokens && tokens.corpus > 0 && tokens.savingsPct != null) {
    root.appendChild(
      el('div', { class: 'stat-group' },
        el('div', { class: 'stat-row' },
          '전달 컨텍스트',
          el('span', { class: 'num' }, '~' + tokens.context + ' tokens'),
        ),
        el('div', { class: 'stat-row' },
          '전량 주입 대비',
          el('span', { class: 'num' }, '~' + tokens.savingsPct + '% 절감 (추정)'),
        ),
      )
    );
  }

  if (data.totalSearches === 0 && data.totalAsks === 0) {
    root.appendChild(el('div', { class: 'empty' }, '아직 사용 기록이 없습니다.\ncfgm search 를 사용해 보세요.'));
    return;
  }

  root.appendChild(buildBarGroup('자주 찾은 질의', data.topQueries || [], (r) => r.query));
  root.appendChild(buildBarGroup('자주 매칭된 페이지', data.topPages || [], (r) => r.pageId));

  const dayGroup = el('div', { class: 'stat-group' },
    el('div', { class: 'stat-group-label' }, '일별 추이'),
  );
  const byDay = data.byDay || [];
  if (!byDay.length) {
    dayGroup.appendChild(el('div', { class: 'day-row' }, '(없음)'));
  } else {
    for (const d of byDay) {
      dayGroup.appendChild(
        el('div', { class: 'day-row' },
          el('span', null, d.date),
          el('span', null, 'search=' + d.searches + ' ask=' + d.asks),
        )
      );
    }
  }
  root.appendChild(dayGroup);
}

function buildBarGroup(label, rows, keyFn) {
  const group = el('div', { class: 'stat-group' },
    el('div', { class: 'stat-group-label' }, label),
  );
  if (!rows.length) {
    group.appendChild(el('div', { class: 'day-row' }, '(없음)'));
    return group;
  }
  const max = Math.max(...rows.map((r) => r.count), 1);
  for (const r of rows) {
    const pct = Math.round((r.count / max) * 100);
    group.appendChild(
      el('div', { class: 'bar-row' },
        el('div', { class: 'bar-label' }, el('span', null, keyFn(r)), el('span', null, String(r.count))),
        el('div', { class: 'bar-track' }, el('div', { class: 'bar-fill', style: 'width:' + pct + '%' })),
      )
    );
  }
  return group;
}

// ---- memory panel (wiki / search / index status / capture queue) ----

let lastQuery = '';

async function loadWiki() {
  if (lastQuery) return; // 검색 결과를 보고 있으면 위키 목록으로 덮어쓰지 않는다
  const root = document.getElementById('memory-results');
  try {
    const res = await fetch('/api/wiki');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    document.getElementById('results-label').textContent = '위키 페이지 (' + data.count + ')';
    renderWikiPages(root, data.pages || []);
  } catch (e) {
    setMessage(root, String(e && e.message || e), 'error');
  }
}

function renderWikiPages(root, pages) {
  clear(root);
  if (!pages.length) {
    setMessage(root, '아직 캡처된 위키 페이지가 없습니다.');
    return;
  }
  for (const p of pages) {
    root.appendChild(
      el('div', { class: 'wiki-row' },
        el('span', { class: 'id mono' }, p.id),
        el('span', { class: 'badge' }, '[' + p.type + '/' + p.status + ']'),
      )
    );
  }
}

async function runSearch(query) {
  lastQuery = query.trim();
  const root = document.getElementById('memory-results');
  if (!lastQuery) {
    document.getElementById('results-label').textContent = '위키 페이지';
    await loadWiki();
    return;
  }
  document.getElementById('results-label').textContent = '"' + lastQuery + '" 검색 결과';
  try {
    const res = await fetch('/api/search?q=' + encodeURIComponent(lastQuery));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    renderSearchHits(root, data);
  } catch (e) {
    setMessage(root, String(e && e.message || e), 'error');
  }
}

function renderSearchHits(root, data) {
  clear(root);
  if (data.indexMissing) {
    setMessage(root, '검색 인덱스가 없습니다 — cfgm rebuild-index 를 먼저 실행하세요.');
    return;
  }
  const hits = data.hits || [];
  if (!hits.length) {
    setMessage(root, '"' + data.query + '" — 근거 없음.');
    return;
  }
  for (const h of hits) {
    root.appendChild(
      el('div', { class: 'hit-row' },
        el('div', null,
          el('span', { class: 'id mono' }, h.pageId),
          el('span', { class: 'badge' }, '[' + h.type + '/' + h.status + ']'),
        ),
        el('div', { class: 'snippet' }, h.snippet),
      )
    );
  }
}

async function loadIndexStatus() {
  const root = document.getElementById('index-status');
  try {
    const res = await fetch('/api/index-status');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    clear(root);
    if (!data.exists) {
      root.appendChild(el('div', { class: 'status-line warn' }, '인덱스 없음 — cfgm rebuild-index 실행 필요'));
      return;
    }
    const rebuiltAt = data.rebuiltAt ? new Date(data.rebuiltAt).toLocaleString('ko-KR') : '-';
    root.appendChild(el('div', { class: 'status-line' }, '위키 ', el('span', { class: 'num' }, String(data.wikiCount)), '건'));
    root.appendChild(el('div', { class: 'status-line' }, '클레임 ', el('span', { class: 'num' }, String(data.claimCount)), '건'));
    root.appendChild(el('div', { class: 'status-line' }, '재생성: ' + rebuiltAt));
    root.appendChild(el('div', { class: 'status-line' }, data.vectorDims > 0 ? '하이브리드(벡터 ' + data.vectorDims + '차원)' : 'lexical-only'));
  } catch (e) {
    setMessage(root, String(e && e.message || e), 'error');
  }
}

async function loadCaptureStatus() {
  const root = document.getElementById('capture-status');
  try {
    const res = await fetch('/api/capture-status');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    clear(root);
    const c = data.counts || {};
    root.appendChild(el('div', { class: 'status-line' + (c.pending > 0 ? ' warn' : '') }, 'pending ', el('span', { class: 'num' }, String(c.pending || 0))));
    root.appendChild(el('div', { class: 'status-line' }, 'done ', el('span', { class: 'num' }, String(c.done || 0))));
    root.appendChild(el('div', { class: 'status-line' + (c.failed > 0 ? ' warn' : '') }, 'failed ', el('span', { class: 'num' }, String(c.failed || 0))));
    root.appendChild(el('div', { class: 'status-line' }, 'draft ', el('span', { class: 'num' }, String(data.draftCount || 0))));
  } catch (e) {
    setMessage(root, String(e && e.message || e), 'error');
  }
}

document.getElementById('search-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') runSearch(e.target.value);
});

loadProblems();
loadStats();
loadWiki();
loadIndexStatus();
loadCaptureStatus();
setInterval(loadProblems, 3000);
setInterval(loadStats, 5000);
setInterval(loadWiki, 5000);
setInterval(loadIndexStatus, 5000);
setInterval(loadCaptureStatus, 5000);
</script>
</body>
</html>
