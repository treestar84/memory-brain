# Honcho self-host (PR-V3.1, ADR-019)
#
# AGPL-3.0 격리: Honcho server 는 별도 container 로 실행. memory-brain 본체
# (MIT, ADR-020) 는 Honcho server 코드를 import/link 하지 않고 HTTP 만 호출.
#
# 사용법:
#   cp docs/.env.honcho.example .env.honcho   # 또는 직접 작성, .gitignore 자동 처리
#   docker compose -f docker-compose.honcho.yml --env-file .env.honcho up -d
#   curl http://localhost:8000/health         # 서버 health 확인
#
# 기본 포트: 8000 (Honcho server), 5433 (Postgres — 기본 5432 와 충돌 회피).
# **모두 127.0.0.1 에 바인딩** — LAN 의 다른 호스트가 접근 불가 (Security review 권고).
#
# **PoC 단계**: image 는 `latest` tag 사용 — production 운영 시 명시적 버전 +
# digest pin 의무 (예: `ghcr.io/plastic-labs/honcho:v2.x.y@sha256:<digest>`).
# `${VAR:?...}` 구문은 .env.honcho 누락 시 compose 가 즉시 실패 (fail-closed).
#
# 자체호스팅 가이드: docs/honcho-self-host.md

services:
  honcho-db:
    image: pgvector/pgvector:pg16
    container_name: memory-brain-honcho-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: honcho
      POSTGRES_PASSWORD: ${HONCHO_DB_PASSWORD:?set HONCHO_DB_PASSWORD in .env.honcho}
      POSTGRES_DB: honcho
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - honcho_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honcho -d honcho"]
      interval: 10s
      timeout: 5s
      retries: 5

  honcho:
    image: ghcr.io/plastic-labs/honcho:latest
    container_name: memory-brain-honcho
    restart: unless-stopped
    depends_on:
      honcho-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://honcho:${HONCHO_DB_PASSWORD:?set HONCHO_DB_PASSWORD in .env.honcho}@honcho-db:5432/honcho
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HONCHO_AUTH_KEY: ${HONCHO_AUTH_KEY:?set HONCHO_AUTH_KEY in .env.honcho}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  honcho_db_data:
    name: memory-brain-honcho-db-data
